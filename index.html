<!DOCTYPE html>
<!-- Defines the document as HTML5 -->

<html>
<!-- <html> is the root element of the webpage -->

<head>
    <!-- <head> contains information about the webpage -->

    <title>My Student Profile</title>
    <!-- <title> sets the title shown on the browser tab -->

    <meta charset="UTF-8">
    <!-- <meta> provides information about the webpage and UTF-8 supports different characters -->

</head>

<body>
<!-- <body> contains all visible content of the webpage -->

    <header>
        <!-- <header> creates the top section of the webpage -->

        <h1>My Student Profile</h1>
        <!-- <h1> creates the main heading -->

        <p>Welcome to my simple webpage!</p>
        <!-- <p> creates a paragraph -->

    </header>


    <nav>
        <!-- <nav> contains the navigation links -->

        <a href="#about">About Me</a>
        <!-- <a> creates a hyperlink to another part of the webpage -->

        |

        <a href="#hobbies">Hobbies</a>
        <!-- <a> creates another hyperlink -->

    </nav>


    <main>
        <!-- <main> contains the main content of the webpage -->


        <section id="about">
            <!-- <section> groups related content together -->

            <h2>About Me</h2>
            <!-- <h2> creates a subheading -->

            <p>
                Hello! I am Jasmin Rhea P. Dagani
            </p>
            <!-- <p> creates a paragraph containing information -->

            <p>
                <strong>My Goal:</strong> To passed this course hehe
            </p>
            <!-- <strong> makes important text bold -->

        </section>


        <section id="hobbies">
            <!-- <section> creates a section for my hobbies -->

            <h2>My Hobbies</h2>
            <!-- <h2> creates the heading for the hobbies section -->

            <ul>
                <!-- <ul> creates an unordered or bulleted list -->

                <li>Playing Table Tennis</li>
                <!-- <li> creates one item in the list -->

                <li>Listening to Music</li>
                <!-- <li> creates another list item -->

                <li>Watching Movies</li>
                <!-- <li> creates another list item -->


            </ul>

            <p>Thank you!</p>
            <!-- <p> creates a paragraph -->

        </section>

    </main>


    <footer>
        <!-- <footer> creates the bottom section of the webpage -->

        <p>Created by jaja</p>
        <!-- <p> displays text in paragraph form -->

    </footer>

</body>

</html>
